<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/agendamento_cadastrar.js" defer></script>
    <title>Cadastro de Agendamento</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Agendamento</h1>
        <form>
            <label for="data">Data e Horário</label><br>
            <input type="datetime-local" id="data" required><br><br>

            <label for="tipo">Tipo de Serviço</label><br>
            <select id="tipo" required>
                <option value="">Selecione...</option>
                <option value="revisao">Revisão</option>
                <option value="manutencao">Manutenção</option>
                <option value="instalacao">Instalação</option>
            </select><br><br>

            <label for="idVeiculo">Código do Veículo</label><br>
            <input type="number" id="idVeiculo" required><br><br>

            <label for="idCliente">Código do Cliente</label><br>
            <input type="number" id="idCliente" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
